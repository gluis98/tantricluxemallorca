# Evita la colisión LICENSE entre yarn y composer en Nixpacks.
# Ver: https://github.com/coollabsio/coolify/issues/4202
# PHP 8.3+ (Nixpacks lee la versión de composer.json)
[phases.setup]
nixPkgs = ["...", "(lib.hiPrio php83Packages.composer)"]

# Asegura que Vite compile assets (public/build). No cachear config aquí:
# APP_URL en build suele ser distinto al dominio final.
[phases.build]
cmds = ["yarn run build"]
